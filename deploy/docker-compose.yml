# Self-hosted deployment (e.g. on a small Linux VPS):
#   cd deploy && DOMAIN=tavli.example.com docker compose up -d --build
# Without DOMAIN the app is served on http://localhost (port 80).
name: tavli

services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Behind Caddy: client addresses come from X-Forwarded-For (fair-play checks)
      TRUST_PROXY: "1"
      # Moderation API (reports, bans): set a long random secret to enable it
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Contact for the browser push services (VAPID keys are generated and stored in /data)
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Daily database copies inside the volume (keep 14); copy /data/backups off the server too
      BACKUP_DIR: /data/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - tavli-data:/data
    expose:
      - "2567"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      # Imprint and privacy notice: name, address ("street|zip city"), e-mail, hosting provider
      args:
        VITE_OPERATOR_NAME: ${OPERATOR_NAME:-}
        VITE_OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
        VITE_OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
        VITE_HOSTING: ${HOSTING:-}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tavli-data:
  caddy-data:
  caddy-config:
